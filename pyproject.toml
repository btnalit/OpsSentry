[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opssentry"
version = "0.2.0"
description = "OpsSentry runtime for agent-driven operations automation"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1,<25",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115,<1",
    "litellm>=1.66,<2",
    "rank-bm25>=0.2.2,<1",
    "uvicorn[standard]>=0.34,<1",
    "pyjwt>=2.8.0,<3",
    "psutil>=5.9.0,<6",
    "redis>=5.0.0,<6",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.26,<1",
]

[tool.setuptools]
packages = {find = {where = ["."]}}
include-package-data = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
