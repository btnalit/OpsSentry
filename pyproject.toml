[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opssentry"
version = "0.2.0"
description = "OpsSentry runtime for agent-driven operations automation"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1,<25",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115,<1",
    "litellm>=1.66,<2",
    "rank-bm25>=0.2.2,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.26,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "agent_manager",
    "config_shield",
    "global_sync",
    "knowledge_core",
    "ops_ledger",
    "sandbox",
    "tool_registry",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
